#cloud-config

package_update: true

packages:
  - ca-certificates
  - curl

write_files:
  - path: /usr/local/sbin/install-docker-and-app.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      set -euxo pipefail

      exec > >(tee -a /var/log/install-docker-and-app.log) 2>&1

      if ! command -v docker >/dev/null 2>&1; then
        install -m 0755 -d /etc/apt/keyrings

        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          -o /etc/apt/keyrings/docker.asc

        chmod a+r /etc/apt/keyrings/docker.asc

        cat > /etc/apt/sources.list.d/docker.sources <<'REPO'
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: noble
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
      REPO

        apt-get update

        apt-get install -y \
          docker-ce \
          docker-ce-cli \
          containerd.io \
          docker-buildx-plugin \
          docker-compose-plugin
      fi

      systemctl enable --now docker
      usermod -aG docker ubuntu

      mkdir -p /home/ubuntu/diplom
      chown -R ubuntu:ubuntu /home/ubuntu/diplom

      cat > /home/ubuntu/diplom/compose.yaml <<'COMPOSE'
      services:
        web:
          image: zooombooom/diplom:latest
          container_name: diplom-web
          ports:
            - "8080:80"
          restart: unless-stopped
      COMPOSE

      chown ubuntu:ubuntu /home/ubuntu/diplom/compose.yaml

      docker pull zooombooom/diplom:latest
      docker rm -f diplom-web 2>/dev/null || true
      docker compose -f /home/ubuntu/diplom/compose.yaml up -d

runcmd:
  - [bash, -c, "/usr/local/sbin/install-docker-and-app.sh"]
