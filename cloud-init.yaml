#cloud-config

users:
  - default
  - name: ubuntu
    shell: /bin/bash
    groups:
      - sudo
    sudo:
      - "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ${jsonencode(ssh_public_key)}

ssh_pwauth: false
disable_root: true

package_update: true

packages:
  - python3
  - python3-apt
